<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify your email - Kauchy</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f9f9f9; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .logo { font-size: 24px; font-weight: bold; color: #111; margin-bottom: 20px; text-align: center; }
        h2 { color: #333; font-size: 20px; text-align: center; margin-bottom: 15px; }
        p { color: #555; font-size: 16px; line-height: 1.5; text-align: center; margin-bottom: 25px; }
        .otp-code { display: block; font-size: 32px; font-weight: bold; letter-spacing: 5px; color: #000; text-align: center; padding: 15px; background-color: #f1f5f9; border-radius: 8px; margin-bottom: 30px; }
        .footer { text-align: center; font-size: 12px; color: #999; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Kauchy</div>
        <h2>Verify your email address</h2>
        <p>Please use the following code to verify your email and complete your registration. This code is valid for 10 minutes.</p>
        <span class="otp-code">{{ otp }}</span>
        <p>If you didn't request this email, you can safely ignore it.</p>
        <div class="footer">
            &copy; 2026 Kauchy. All rights reserved.
        </div>
    </div>
</body>
</html>
